name: Sandbox conformance

on:
  schedule:
    - cron: "23 3 * * 2"
  workflow_dispatch:

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} native escape suite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Linux namespace helper
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - run: cargo +${{ steps.rust.outputs.version }} test -p arsy-sandbox --test sandbox_escape --locked
