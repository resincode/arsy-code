name: Performance

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-thresholds:
    name: Deterministic regression thresholds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - run: cargo +${{ steps.rust.outputs.version }} test -p arsy-code benchmark::tests --locked
      - run: cargo +${{ steps.rust.outputs.version }} bench -p arsy-code --bench performance --locked -- --gate

  noisy-end-to-end:
    name: Noisy cold/warm repository benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - run: cargo +${{ steps.rust.outputs.version }} bench -p arsy-code --bench performance --locked
