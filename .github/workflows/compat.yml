name: Compatibility

on:
  pull_request:
    paths:
      - "crates/arsy-compat/**"
      - "crates/arsy-kernel/**"
      - "fixtures/compat/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/arsy-compat/**"
      - "crates/arsy-kernel/**"
      - "fixtures/compat/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: arsy-compat / workspace Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Linux credential-store dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
        with:
          components: rustfmt,clippy
      - name: Formatting
        run: cargo +${{ steps.rust.outputs.version }} fmt --all -- --check
      - name: Clippy
        run: cargo +${{ steps.rust.outputs.version }} clippy -p arsy-compat --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo +${{ steps.rust.outputs.version }} test -p arsy-compat --all-targets --all-features --locked
      - name: Compatibility fixtures
        run: python3 fixtures/compat/check.py
